name = "jacobian_challenge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JacobianChallenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Diagnostics on by default. `diagnostics = true` + a threshold of 100
# surfaces high-count unfolds in CI logs the moment they appear, so
# whnf / isDefEq loops are caught before they manifest as heartbeat
# timeouts. Empty output for files with no real proofs (e.g. the
# verbatim signature in `Basic.lean`); becomes useful immediately as
# soon as a sorry is replaced with content. See `DEVELOPMENT.md`
# "Diagnostic workflow for Lean timeouts and loops".
diagnostics = true
"diagnostics.threshold" = 100

# Pinned to the exact mathlib commit Buzzard specified in the challenge gist
# (https://gist.github.com/kbuzzard/778bc714030b3e974ab5f4038783d1a9, v0.3,
# "compiles with commit 8e3c989104daaa052921bf43de9eef0e1ac9fbf5 (15th April 2026)").
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "8e3c989104daaa052921bf43de9eef0e1ac9fbf5"

[[lean_lib]]
name = "JacobianChallenge"
