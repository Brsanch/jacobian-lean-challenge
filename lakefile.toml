name = "jacobian_challenge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JacobianChallenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Diagnostics on by default. Only `diagnostics` is settable as a
# lake-level `-D` flag at this Lean version — `diagnostics.threshold`
# is registered by mathlib at runtime and rejected as a `-D` option
# (`error: invalid -D parameter, unknown configuration option
# '«diagnostics.threshold»'`). For tighter thresholds when chasing a
# whnf / isDefEq loop, add a per-file `set_option diagnostics.threshold
# 100` *after* `import Mathlib`. See `DEVELOPMENT.md` "Diagnostic
# workflow for Lean timeouts and loops".
diagnostics = true

# Pinned to the exact mathlib commit Buzzard specified in the challenge gist
# (https://gist.github.com/kbuzzard/778bc714030b3e974ab5f4038783d1a9, v0.3,
# "compiles with commit 8e3c989104daaa052921bf43de9eef0e1ac9fbf5 (15th April 2026)").
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "8e3c989104daaa052921bf43de9eef0e1ac9fbf5"

[[lean_lib]]
name = "JacobianChallenge"
