name = "jacobian_challenge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JacobianChallenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Diagnostics on by default. Only `diagnostics` is settable as a
# lake-level `-D` flag at this Lean version — `diagnostics.threshold`
# is registered by mathlib at runtime and rejected as a `-D` option
# (`error: invalid -D parameter, unknown configuration option
# '«diagnostics.threshold»'`). For tighter thresholds when chasing a
# whnf / isDefEq loop, add a per-file `set_option diagnostics.threshold
# 100` *after* `import Mathlib`. See `DEVELOPMENT.md` "Diagnostic
# workflow for Lean timeouts and loops".
diagnostics = true

# Pinned to the mathlib commit Buzzard specified in the v0.3 gist
# (https://gist.github.com/kbuzzard/778bc714030b3e974ab5f4038783d1a9,
# "compiles with commit 8e3c989104daaa052921bf43de9eef0e1ac9fbf5 (15th April 2026)").
#
# Repo's Basic.lean signatures use the v0.4 notation (`𝓘(ℂ, E)` instead of
# `modelWithCornersSelf ℂ E`) per the 2026-05-21 gist revision. v0.4's
# stated mathlib pin is `548398201a64f3a5127d90d83945278cfe38cac4` (15th
# May 2026); we remain pinned to v0.3's `8e3c989...` because Buzzard's
# own v0.4 changelog states "v0.4 is syntactically identical to v0.3"
# — both notations are definitionally equal in mathlib, so the math
# content is identical. Pin bump deferred to avoid full-repo recompile
# from source (no `cache get` due to apfsd panic risk per CLAUDE.md).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "8e3c989104daaa052921bf43de9eef0e1ac9fbf5"

[[lean_lib]]
name = "JacobianChallenge"
